<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Daybreak Coffee Co. | Genesis Copywrite Portfolio Demo</title><style>

elative;width:160px;height:120px;background:linear-gradient(110deg,#f8f4e9,#d2bea1);border-radius:8px 8px 65px 65px;box-shadow:0 25px 30px #231b1755;transform:rotate(-5deg)}.cup:before{content:'';position:absolute;top:-19px;left:0;width:160px;height:40px;border-radius:50%;background:radial-gradient(ellipse,#7c462b 0 40%,#e6d7ba 42% 64%,#f6e9d2 67%)}.cup:after{content:'';position:absolute;right:-49px;top:18px;width:57px;height:65px;border:15px solid #e7d6bb;border-radius:50%}.section{padding:35px 5% 55px}.section h2{font-family:Georgia,serif;font-size:36px;letter-spacing:-.04em;margin:12px 0}.cta{background:#344438;color:#fff;border:0;border-radius:4px;padding:13px 20px;margin-top:12px;font-weight:bold}.cta:hover{background:#203126}.outline{background:transparent;color:#344438;border:1px solid #344438}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.card{border:1px solid #e2d8c9;border-radius:6px;padding:22px;background:#fffdfa;min-height:150px}.card h3{font-family:Georgia,serif;margin:12px 0}.card p{color:#665e55;line-height:1.55;font-size:14px}.stamp{font-size:30px}.pill{display:inline-block;background:#eee4d3;padding:7px 12px;font-size:12px;border-radius:99px;color:#66533f;font-weight:700}.footer{border-top:1px solid #e2d8c9;padding:17px 5%;color:#796c5d;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.note{border-top:1px solid #323831;background:#181b17;color:#ced5c8;text-align:center;padding:12px 18px;font-size:12px}.info{max-width:680px}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26372b;color:#fff;padding:13px 20px;border-radius:8px;box-shadow:0 8px 28px #0004;max-width:90%;font-size:13px;z-index:10}.story{font-size:18px;line-height:1.75;max-width:710px;color:#5a5146}.accent{color:#8b603c} @media(max-width:720px){.mast{align-items:flex-start;flex-direction:column}.nav{gap:1px}.nav button{padding:8px}.hero{grid-template-columns: <div class="studio"><div><strong>GENESIS COPYWRITE <span style="opacity:.6">/ INTERACTIVE PORTFOLIO</span></strong><small>Explore the same business before and after the rewrite.</small></div><div class="switch" role="group" aria-label="Copy version"><button id="before" aria-pressed="true">Before</button><button id="after" aria-pressed="false">After ✦</button></div></div>
<div class="page"><header class="mast"><div class="brand">daybreak<span>.</span></div><nav class="nav" aria-label="Demo pages"><button data-page="home" class="active">Home</button><button data-page="coffee">Our Coffee</button><button data-page="plans">Subscriptions</button><button data-page="about">About Us</button></nav></header><main id="main" tabindex="-1"></main><footer class="footer"><span>© Daybreak Coffee Co. — Fictional portfolio project</span><span>Copywriting demo by Genesis Copywrite</span></footer></div><div class="note">Illustrative sample copy · No purchases or subscriptions are processed in this demo.</div><div id="toast" class="toast hidden" role="status"></div>
<script>
const versions={before:{home:{k:'Welcome',title:'Welcome to Daybreak Coffee',lead:'We provide premium coffee products and convenient subscription services for all your coffee needs.',cta:'Learn More',features:[['Quality Products','Our coffee products are made from quality beans and available in different varieties.'],['Subscription Options','Choose from our selection of coffee subscription plans to suit your preferences.'],['Customer Service','Our team is here to help customers with questions about our products.']]},coffee:{k:'Our Products',title:'Browse Our Coffee Selection',lead:'We offer a variety of coffees with different roast levels and flavor profiles for different customer preferences.',cta:'See Subscription Options',features:[['Light Roast','A lightly roasted coffee with a smooth taste.'],['Medium Roast','Our medium roast is a popular choice for everyday coffee drinking.'],['Dark Roast','A rich dark roast for customers who prefer stronger flavors.']]},plans:{k:'Coffee Subscriptions',title:'Our Subscription Plans',lead:'We offer flexible coffee subscriptions. Select a delivery schedule and choose from available coffee products.',cta:'View Plan Details',features:[['The Starter','One bag of coffee delivered each month.'],['The Regular','Two bags of coffee delivered every month.'],['The Enthusiast','Four bags of coffee delivered monthly.']]},about:{k:'Who We Are',title:'About Daybreak Coffee Co.',lead:'Daybreak Coffee Co. is committed to providing premium coffee products and convenient delivery services.',story:'Our company was established to meet the needs of coffee consumers looking for a reliable coffee subscription option. We value quality, service and customer satisfaction.',cta:'Explore Our Coffee'}},after:{home:{k:'Coffee worth waking up for',title:'Make Your Mornings Something to Look Forward To.',lead:'No more sad, stale coffee or last-minute grocery runs. Just outrageously good beans showing up at your door, right when you need them.',cta:'Find Your Morning Roast',features:[['Fresh Beats Forgettable','Beans roasted for mornings worth remembering.'],['Your Routine, Your Rules','Pick your roast, set your schedule, and change it when life changes.'],['One Less Thing to Worry About','The only thing you have to do is put the kettle on.']]},coffee:{k:'Meet your morning ritual',title:'Good Coffee. Great Company. Zero Guesswork.',lead:'Bright and lively? Smooth and familiar? Bold enough to wake the neighbors? There’s a bag with your name on it.',cta:'Build Your Coffee Routine',features:[['The Early Bird','Light, bright, and ready to put a little sunshine in your cup.'],['The Daily Driver','Comforting, balanced, and always ready for a second round.'],['The Night Owl','Deep, bold flavor for mornings that mean business.']]},plans:{k:'A little joy, on repeat',title:'Your Coffee Schedule. Your Call.',lead:'One bag or four. Every few weeks or once a month. Keep the good stuff coming without a commitment that outlasts your enthusiasm.',cta:'Choose Your Rhythm',features:[['Just Warming Up','One bag a month for the casual coffee lover.'],['Right on Schedule','Two bags a month, so your favorite cup is always close.'],['Fully Caffeinated','Four bags a month for households that mean business.']]},about:{k:'A better start',title:'We Believe Mornings Deserve Better.',lead:'We’re here for the small, beautiful ritual that happens before the day gets loud.',story:'That first sip. The quiet kitchen. The moment the world belongs to you before it belongs to everybody else. We built Daybreak for those moments—thoughtfully chosen coffee, delivered on your terms, to help ordinary mornings feel a little extraordinary.',cta:'Meet Your New Favorite Roast'}}};
let version='before',page='home';const main=document.getElementById('main');function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){let x=versions[version][page];document.getElementById('before').setAttribute('aria-pressed',version==='before');document.getElementById('after').setAttribute('aria-pressed',version==='after');document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);el.setAttribute('aria-current',el.dataset.page===page?'page':'false')});let cards=x.features?`<section class="section"><span class="eyebrow">${version==='before'?'Our features':'Why Daybreak?'}</span><div class="cards">${x.features.map((a,i)=>`<article class="card"><span class="stamp">${['☕','✦','◈'][i]}</span><h3>${escapeHtml(a[0])}</h3><p>${escapeHtml(a[1])}</p></article>`).join('')}</div></section>`:`<section class="section"><p class="story">${escapeHtml(x.story)}</p></section>`;let next=page==='home'?'coffee':page==='coffee'?'plans':page==='plans'?'plans':'coffee';main.innerHTML=`<section class="hero"><div class="heroText"><span class="eyebrow">${escapeHtml(x.k)}</span><h1>${escapeHtml(x.title)}</h1><p>${escapeHtml(x.lead)}</p><button class="cta" data-action="${next}">${escapeHtml(x.cta)} →</button></div><div class="heroArt" role="img" aria-label="Stylized coffee cup illustration"><div class="cup"></div></div></section>${cards}`;main.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(page==='plans'){notice('Demo only — this would lead to a subscription checkout on a live store.')}else setPage(b.dataset.action)}));}function setPage(p){page=p;render();main.focus({preventScroll:true});}function notice(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.classList.add('hidden'),3500)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));['before','after'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{version=id;render()}));render();
</script></body></html>
